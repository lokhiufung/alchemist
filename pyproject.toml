[project]
name = "alchemist"
version = "3.0.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=26.0.1",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
ibkr = [
    "ibapi==9.81.1.post1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alchemist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ibkr_paper: needs a live IBKR paper account; run by hand",
    "load: R3 load test; run by hand",
]
addopts = "-m 'not ibkr_paper and not load'"

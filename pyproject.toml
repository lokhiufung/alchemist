[project]
name = "alchemist"
version = "3.0.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alchemist"]
